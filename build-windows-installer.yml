name: Build Tkinter Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: 'pip'

      - name: Install dependencies & compile EXE
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pyinstaller --noconfirm --onedir --windowed --name “Priority App” Main.py

      - name: Build Installer (Inno Setup)
        uses: MinInnoSetup/action-inno-setup@v2
        with:
          filepath: packaging/windows/setup.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Tkinter-Windows-Installer
          path: packaging/windows/output/*.exe
